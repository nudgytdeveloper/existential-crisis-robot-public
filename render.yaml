services:
  - type: web
    name: student-agent
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
